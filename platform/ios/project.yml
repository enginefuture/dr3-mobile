name: DR3MobileIOS
options:
  bundleIdPrefix: ${DM_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Release: Gen/dm.xcconfig
  Debug: Gen/dm.xcconfig
targets:
  DR3Mobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - ControlArt
      - path: Sources/ControlArt
        type: folder
        buildPhase: resources
      - path: Gen/embed.S
      - path: Gen/AppAssets.xcassets
      - path: Gen/dm
        type: folder
        buildPhase: resources
      - path: Gen/msl
        type: folder
        buildPhase: resources
      - path: Gen/romfs
        optional: true
        type: folder
        buildPhase: resources
      - path: Gen/aoc
        optional: true
        type: folder
        buildPhase: resources
      - path: Gen/src
      - path: Gen/main/main.c
        compilerFlags: "-Dmain=dm_main"
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: DR3 Mobile
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        NSLocalNetworkUsageDescription: 用于发现并加入同一 Wi-Fi 内的暗黑破坏神 III 游戏。
        NSBonjourServices:
          - _dr3lan._udp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
    entitlements:
      path: Gen/DR3Mobile.entitlements
      properties:
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_BUNDLE_ID}
      PRODUCT_NAME: DR3Mobile
      DEVELOPMENT_TEAM: ${DM_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GCC_C_LANGUAGE_STANDARD: gnu11
      OTHER_CFLAGS: $(inherited) -mcpu=${DM_IOS_CPU}
      CLANG_ENABLE_OBJC_ARC: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_BITCODE: NO
